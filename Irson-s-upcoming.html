<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Irson's Goal Editor</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-p-6">

    <div class="max-w-4xl mx-auto p-6 bg-white shadow-lg rounded-xl mt-10">
        <header class="border-b pb-4 mb-6 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold text-indigo-600">Irson's Goal Editor</h1>
                <p class="text-sm text-slate-500">Track milestones, target dates, and progress.</p>
            </div>
            <button onclick="openModal()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition font-medium">
                + Add New Goal
            </button>
        </header>

        <!-- Goals List Container -->
        <div id="goals-container" class="space-y-4">
            <!-- Dynamic Goals will load here -->
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="goal-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-xl">
            <h2 id="modal-title" class="text-xl font-bold mb-4">Add Goal</h2>
            <form id="goal-form" onsubmit="saveGoal(event)" class="space-y-4">
                <input type="hidden" id="goal-id">
                <div>
                    <label class="block text-sm font-medium text-slate-700">Goal Title</label>
                    <input type="text" id="goal-text" required class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700">Target Date / Year</label>
                    <input type="text" id="goal-target" required placeholder="e.g. October 1, 2027" class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-200 rounded-lg hover:bg-slate-300">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">Save Goal</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Initial Goals Data based on your roadmap
        let goals = JSON.parse(localStorage.getItem('irson_goals')) || [
            { id: 1, text: "Finished Learning Web Development", target: "October 1, 2027", completed: false },
            { id: 2, text: "Work remotely for a U.S. company", target: "November 30, 2027", completed: false },
            { id: 3, text: "Get medical treatment for Grandma (Nainai) in the U.S.", target: "October 1, 2028", completed: false },
            { id: 4, text: "Buy a Tesla car for road trips around NY and the U.S.", target: "May 15, 2029", completed: false },
            { id: 5, text: "Buy a home at 83-45 Vietor Avenue, Elmhurst, Queens, NY", target: "June 30, 2030", completed: false }
        ];

        function renderGoals() {
            const container = document.getElementById('goals-container');
            container.innerHTML = '';
            
            goals.forEach(goal => {
                const card = document.createElement('div');
                card.className = `p-4 border rounded-xl flex items-center justify-between transition ${goal.completed ? 'bg-slate-100 border-slate-300 opacity-75' : 'bg-white border-indigo-100 shadow-sm'}`;
                
                card.innerHTML = `
                    <div class="flex items-center space-x-4">
                        <input type="checkbox" ${goal.completed ? 'checked' : ''} onclick="toggleGoal(${goal.id})" class="w-5 h-5 text-indigo-600 rounded cursor-pointer">
                        <div>
                            <h3 class="font-semibold text-lg ${goal.completed ? 'line-through text-slate-500' : 'text-slate-800'}">${goal.text}</h3>
                            <span class="text-xs bg-indigo-50 text-indigo-700 px-2 py-1 rounded-full font-medium">Target: ${goal.target}</span>
                        </div>
                    </div>
                    <div class="space-x-2">
                        <button onclick="editGoal(${goal.id})" class="text-slate-400 hover:text-indigo-600 text-sm font-medium">Edit</button>
                        <button onclick="deleteGoal(${goal.id})" class="text-slate-400 hover:text-red-600 text-sm font-medium">Delete</button>
                    </div>
                `;
                container.appendChild(card);
            });
            localStorage.setItem('irson_goals', JSON.stringify(goals));
        }

        function openModal(id = null) {
            document.getElementById('goal-modal').classList.remove('hidden');
            if (id) {
                document.getElementById('modal-title').innerText = "Edit Goal";
                const goal = goals.find(g => g.id === id);
                document.getElementById('goal-id').value = goal.id;
                document.getElementById('goal-text').value = goal.text;
                document.getElementById('goal-target').value = goal.target;
            } else {
                document.getElementById('modal-title').innerText = "Add Goal";
                document.getElementById('goal-form').reset();
                document.getElementById('goal-id').value = '';
            }
        }

        function closeModal() {
            document.getElementById('goal-modal').classList.add('hidden');
        }

        function saveGoal(e) {
            e.preventDefault();
            const id = document.getElementById('goal-id').value;
            const text = document.getElementById('goal-text').value;
            const target = document.getElementById('goal-target').value;

            if (id) {
                const goal = goals.find(g => g.id == id);
                goal.text = text;
                goal.target = target;
            } else {
                const newGoal = { id: Date.now(), text, target, completed: false };
                goals.push(newGoal);
            }
            closeModal();
            renderGoals();
        }

        function toggleGoal(id) {
            const goal = goals.find(g => g.id === id);
            goal.completed = !goal.completed;
            renderGoals();
        }

        function deleteGoal(id) {
            goals = goals.filter(g => g.id !== id);
            renderGoals();
        }

        // Initial render on page load
        renderGoals();
    </script>
</body>
</html>
