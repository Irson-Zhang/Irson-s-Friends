<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Irson's Goals Application Editor</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-6">

  <div class="max-w-3xl mx-auto">
    <!-- Header -->
    <header class="mb-8 text-center">
      <h1 class="text-3xl font-bold text-slate-900 tracking-tight">Irson's Goals Editor</h1>
      <p class="text-slate-600 mt-2">Plan milestones, track target dates, and build your future step by step.</p>
    </header>

    <!-- Goal Input Form -->
    <div class="bg-white rounded-xl shadow-md p-6 mb-8 border border-slate-100">
      <h2 class="text-lg font-semibold text-slate-800 mb-4">Add a New Goal</h2>
      <form id="goal-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Goal Title & Description</label>
          <input type="text" id="goal-title" required placeholder="e.g., Finished Learning Web Development" 
            class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Target Date</label>
            <input type="date" id="goal-date" required 
              class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Category</label>
            <select id="goal-category" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
              <option value="Career & Skills">Career & Skills</option>
              <option value="Family">Family</option>
              <option value="Lifestyle & Travel">Lifestyle & Travel</option>
              <option value="Real Estate">Real Estate</option>
            </select>
          </div>
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition duration-200">
          Save Goal
        </button>
      </form>
    </div>

    <!-- Goals List Section -->
    <div class="bg-white rounded-xl shadow-md p-6 border border-slate-100">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-semibold text-slate-800">Your Target Milestones</h2>
        <span id="goal-count" class="text-sm bg-blue-100 text-blue-800 font-medium px-2.5 py-0.5 rounded-full">0 goals</span>
      </div>
      <div id="goals-container" class="space-y-3">
        <!-- Dynamic goals will be injected here -->
        <p id="empty-state" class="text-slate-400 text-center py-6">No goals added yet. Start adding your milestones above!</p>
      </div>
    </div>
  </div>

  <!-- JavaScript Logic -->
  <script>
    const form = document.getElementById('goal-form');
    const titleInput = document.getElementById('goal-title');
    const dateInput = document.getElementById('goal-date');
    const categoryInput = document.getElementById('goal-category');
    const container = document.getElementById('goals-container');
    const goalCount = document.getElementById('goal-count');
    const emptyState = document.getElementById('empty-state');

    // Load existing goals from localStorage or initialize default goals
    let goals = JSON.parse(localStorage.getItem('irsons_goals')) || [
      { id: 1, title: 'Finished Learning Web Development', date: '2027-10-01', category: 'Career & Skills', completed: false },
      { id: 2, title: 'Work remotely for a U.S. company', date: '2027-11-30', category: 'Career & Skills', completed: false },
      { id: 3, title: 'Get medical treatment for Grandma in the U.S.', date: '2028-10-01', category: 'Family', completed: false },
      { id: 4, title: 'Buy a Tesla car for U.S. road trips', date: '2029-05-15', category: 'Lifestyle & Travel', completed: false },
      { id: 5, title: 'Buy a home at Vietor Avenue, Elmhurst, Queens, NY', date: '2030-06-30', category: 'Real Estate', completed: false }
    ];

    function saveAndRender() {
      localStorage.setItem('irsons_goals', JSON.stringify(goals));
      renderGoals();
    }

    function renderGoals() {
      container.innerHTML = '';
      goalCount.textContent = `${goals.length} goal${goals.length === 1 ? '' : 's'}`;

      if (goals.length === 0) {
        container.appendChild(emptyState);
        return;
      }

      goals.forEach((goal) => {
        const card = document.createElement('div');
        card.className = `p-4 rounded-lg border transition flex items-center justify-between ${goal.completed ? 'bg-emerald-50 border-emerald-200' : 'bg-slate-50 border-slate-200'}`;
        
        card.innerHTML = `
          <div class="flex items-start space-x-3">
            <input type="checkbox" ${goal.completed ? 'checked' : ''} onclick="toggleGoal(${goal.id})" class="mt-1 h-4 w-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500">
            <div>
              <h3 class="font-medium text-slate-800 ${goal.completed ? 'line-through text-slate-500' : ''}">${goal.title}</h3>
              <div class="flex items-center space-x-2 mt-1">
                <span class="text-xs px-2 py-0.5 rounded bg-slate-200 text-slate-700">${goal.category}</span>
                <span class="text-xs text-slate-500">Target: ${goal.date}</span>
              </div>
            </div>
          </div>
          <button onclick="deleteGoal(${goal.id})" class="text-red-500 hover:text-red-700 text-sm font-medium px-2 py-1">Delete</button>
        `;
        container.appendChild(card);
      });
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const newGoal = {
        id: Date.now(),
        title: titleInput.value.trim(),
        date: dateInput.value,
        category: categoryInput.value,
        completed: false
      };
      goals.push(newGoal);
      titleInput.value = '';
      dateInput.value = '';
      saveAndRender();
    });

    window.toggleGoal = function(id) {
      goals = goals.map(g => g.id === id ? { ...g, completed: !g.completed } : g);
      saveAndRender();
    };

    window.deleteGoal = function(id) {
      goals = goals.filter(g => g.id !== id);
      saveAndRender();
    };

    // Initial render on load
    renderGoals();
  </script>
</body>
</html>
