<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Irson's Advanced MERN/Next.js Style Goals Editor</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js / Advanced Reactive UI styling hooks if needed, using pure vanilla advanced JS state handler -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eef2ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-900 text-slate-100 h-full font-sans antialiased flex flex-col selection:bg-brand-500 selection:text-white">

    <!-- Top Navigation Bar (Next.js App Router Layout Feel) -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-30 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="h-9 w-9 bg-brand-600 rounded-xl flex items-center justify-center shadow-lg shadow-brand-500/30">
                <i class="fa-solid fa-bullseye text-white"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg tracking-tight">Irson's Master Goals Engine</h1>
                <p class="text-xs text-slate-400">Advanced Full-Stack Architecture Simulation (React / MERN / Next.js)</p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <button onclick="app.syncDatabase()" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-2 rounded-lg border border-slate-700 transition flex items-center space-x-2">
                <i id="sync-icon" class="fa-solid fa-cloud text-emerald-400"></i>
                <span id="sync-text">API Synced</span>
            </button>
            <button onclick="app.openModal()" class="bg-brand-600 hover:bg-brand-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-lg shadow-brand-600/20 flex items-center space-x-2">
                <i class="fa-solid fa-plus"></i>
                <span>New Goal</span>
            </button>
        </div>
    </header>

    <!-- Main Workspace Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-6 grid grid-cols-1 lg:grid-cols-4 gap-6 overflow-hidden">
        
        <!-- Left Sidebar: Analytics & Filters -->
        <aside class="lg:col-span-1 space-y-6 flex flex-col">
            <div class="bg-slate-800/50 border border-slate-800 rounded-2xl p-5 space-y-4">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Dashboard Metrics</h2>
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                        <span class="text-xs text-slate-400">Total Goals</span>
                        <p id="stat-total" class="text-2xl font-bold text-indigo-400">0</p>
                    </div>
                    <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                        <span class="text-xs text-slate-400">Completed</span>
                        <p id="stat-completed" class="text-2xl font-bold text-emerald-400">0</p>
                    </div>
                </div>
                <div>
                    <div class="flex justify-between text-xs text-slate-400 mb-1">
                        <span>Overall Progress</span>
                        <span id="progress-percent">0%</span>
                    </div>
                    <div class="w-full bg-slate-900 h-2 rounded-full overflow-hidden border border-slate-800">
                        <div id="progress-bar" class="bg-gradient-to-r from-brand-500 to-emerald-400 h-full w-0 transition-all duration-500"></div>
                    </div>
                </div>
            </div>

            <div class="bg-slate-800/50 border border-slate-800 rounded-2xl p-5 space-y-3 flex-1 flex flex-col">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Filter View</h2>
                <div class="space-y-1">
                    <button onclick="app.setFilter('all')" class="w-full text-left px-3 py-2 rounded-xl text-sm transition font-medium filter-btn bg-brand-600/10 text-brand-400 border border-brand-500/20" data-filter="all">All Goals</button>
                    <button onclick="app.setFilter('active')" class="w-full text-left px-3 py-2 rounded-xl text-sm transition font-medium filter-btn text-slate-400 hover:bg-slate-800" data-filter="active">In Progress</button>
                    <button onclick="app.setFilter('completed')" class="w-full text-left px-3 py-2 rounded-xl text-sm transition font-medium filter-btn text-slate-400 hover:bg-slate-800" data-filter="completed">Achieved</button>
                </div>

                <div class="pt-4 mt-auto border-t border-slate-800/80">
                    <button onclick="app.triggerAIPlanner()" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white p-3 rounded-xl text-xs font-semibold shadow-lg shadow-purple-900/30 transition flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                        <span>AI Goal Breakdown Assistant</span>
                    </button>
                </div>
            </div>
        </aside>

        <!-- Right Content Area: Goal Cards Grid / Editor View -->
        <section class="lg:col-span-3 flex flex-col bg-slate-800/30 border border-slate-800 rounded-2xl p-6 overflow-hidden">
            <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-800">
                <h2 id="view-title" class="font-semibold text-slate-200">Active Roadmap Items</h2>
                <div class="flex items-center space-x-2 text-xs text-slate-400">
                    <i class="fa-solid fa-database"></i>
                    <span>Storage: MongoDB / LocalStorage Mirror</span>
                </div>
            </div>

            <!-- Dynamic Container Grid -->
            <div id="goals-grid" class="flex-1 overflow-y-auto pr-2 space-y-3">
                <!-- Injected via Advanced JS DOM Engine -->
            </div>
        </section>
    </main>

    <!-- Modal Form Editor (Create / Update Record) -->
    <div id="goal-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-5 animate-in fade-in zoom-in-95 duration-200">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 id="modal-heading" class="font-bold text-lg text-slate-100">Create / Edit Goal</h3>
                <button onclick="app.closeModal()" class="text-slate-400 hover:text-slate-100"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="goal-form" onsubmit="app.handleFormSubmit(event)" class="space-y-4">
                <input type="hidden" id="edit-id">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Goal Objective Statement</label>
                    <textarea id="form-text" rows="2" required placeholder="e.g. Buy a home at 83-45 Vietor Avenue, Elmhurst, Queens..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-100 focus:outline-none focus:border-brand-500 transition"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Target Milestone Date</label>
                        <input type="text" id="form-target" required placeholder="e.g. June 30, 2030" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-100 focus:outline-none focus:border-brand-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Category Domain</label>
                        <select id="form-category" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-100 focus:outline-none focus:border-brand-500 transition">
                            <option value="Health & Body">Health & Body</option>
                            <option value="Career & Web">Career & Web Dev</option>
                            <option value="Family & Relocation">Family & Relocation</option>
                            <option value="Assets & Lifestyle">Assets & Lifestyle</option>
                        </select>
                    </div>
                </div>
                <div class="flex justify-end space-x-3 pt-4 border-t border-slate-800">
                    <button type="button" onclick="app.closeModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-sm font-medium transition">Cancel</button>
                    <button type="submit" class="px-5 py-2 bg-brand-600 hover:bg-brand-500 text-white rounded-xl text-sm font-medium transition shadow-lg shadow-brand-600/20">Save Record</button>
                </div>
            </form>
        </div>
    </div>

    <!-- AI Assistant Modal Result Simulator -->
    <div id="ai-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-purple-500/30 rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <div class="flex items-center space-x-2 text-purple-400">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <h3 class="font-bold text-lg text-slate-100">LLM Roadmap Decomposition</h3>
                </div>
                <button onclick="app.closeAIModal()" class="text-slate-400 hover:text-slate-100"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="ai-content-area" class="text-sm text-slate-300 space-y-2 max-h-64 overflow-y-auto p-3 bg-slate-950 rounded-xl border border-slate-800">
                <!-- AI analysis injections -->
            </div>
            <div class="flex justify-end">
                <button onclick="app.closeAIModal()" class="px-4 py-2 bg-purple-600 hover:bg-purple-500 text-white rounded-xl text-sm font-medium transition">Got it, apply strategy</button>
            </div>
        </div>
    </div>

    <!-- Advanced Full-Stack Architecture State & DOM Management Engine -->
    <script>
        class GoalsAppEngine {
            constructor() {
                // Initialize state mirroring a NoSQL Database (MongoDB / MERN structure)
                this.state = {
                    goals: JSON.parse(localStorage.getItem('irson_master_goals')) || [
                        { id: '1', text: "All ears are good listening, healed, and able to hear more clearly.", target: "Ongoing", category: "Health & Body", completed: true },
                        { id: '2', text: "The whole body is complete, perfect, functioning well, and normal.", target: "Ongoing", category: "Health & Body", completed: true },
                        { id: '3', text: "Finished Learning Web Development", target: "October 1, 2027", category: "Career & Web", completed: false },
                        { id: '4', text: "Work remotely for a U.S. company", target: "November 30, 2027", category: "Career & Web", completed: false },
                        { id: '5', text: "Get medical treatment for Grandma (Nainai) in the United States", target: "October 1, 2028", category: "Family & Relocation", completed: false },
                        { id: '6', text: "Buy a Tesla car to take road trips around New York, Long Island, Upstate", target: "May 15, 2029", category: "Assets & Lifestyle", completed: false },
                        { id: '7', text: "Buy a home at 83-45 Vietor Avenue, Elmhurst, Queens, New York", target: "June 30, 2030", category: "Assets & Lifestyle", completed: false },
                        { id: '8', text: "Live and travel in the U.S., visit family in Indonesia; only 2 countries", target: "January 1, 2035", category: "Family & Relocation", completed: false }
                    ],
                    filter: 'all',
                    syncStatus: 'synced'
                };
                
                this.init();
            }

            init() {
                this.render();
            }

            // Database Persistence Simulation (MERN / LocalStorage Backend Layer)
            persist() {
                localStorage.setItem('irson_master_goals', JSON.stringify(this.state.goals));
                this.state.syncStatus = 'saving';
                this.renderMetrics();
                
                setTimeout(() => {
                    this.state.syncStatus = 'synced';
                    const indicator = document.getElementById('sync-text');
                    if(indicator) indicator.innerText = "API Synced";
                }, 600);
            }

            setFilter(filterType) {
                this.state.filter = filterType;
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    if(btn.dataset.filter === filterType) {
                        btn.className = "w-full text-left px-3 py-2 rounded-xl text-sm transition font-medium filter-btn bg-brand-600/10 text-brand-400 border border-brand-500/20";
                    } else {
                        btn.className = "w-full text-left px-3 py-2 rounded-xl text-sm transition font-medium filter-btn text-slate-400 hover:bg-slate-800";
                    }
                });
                this.renderGoalsList();
            }

            // Advanced DOM Re-renderer Engine (Virtual DOM React-style execution flow)
            render() {
                this.renderMetrics();
                this.renderGoalsList();
            }

            renderMetrics() {
                const total = this.state.goals.length;
                const completed = this.state.goals.filter(g => g.completed).length;
                const percent = total > 0 ? Math.round((completed / total) * 100) : 0;

                document.getElementById('stat-total').innerText = total;
                document.getElementById('stat-completed').innerText = completed;
                document.getElementById('progress-percent').innerText = `${percent}%`;
                document.getElementById('progress-bar').style.width = `${percent}%`;
            }

            renderGoalsList() {
                const container = document.getElementById('goals-grid');
                container.innerHTML = '';

                let filteredGoals = this.state.goals;
                if(this.state.filter === 'active') filteredGoals = this.state.goals.filter(g => !g.completed);
                if(this.state.filter === 'completed') filteredGoals = this.state.goals.filter(g => g.completed);

                if(filteredGoals.length === 0) {
                    container.innerHTML = `
                        <div class="flex flex-col items-center justify-center h-48 text-slate-500 space-y-2">
                            <i class="fa-solid fa-folder-open text-3xl"></i>
                            <p class="text-sm">No goal items found under current filter view.</p>
                        </div>
                    `;
                    return;
                }

                filteredGoals.forEach(goal => {
                    const card = document.createElement('div');
                    card.className = `p-4 rounded-xl border transition-all flex items-start justify-between gap-4 ${
                        goal.completed 
                            ? 'bg-slate-900/40 border-slate-800/80 opacity-60' 
                            : 'bg-slate-900 border-slate-800 hover:border-slate-700 shadow-sm'
                    }`;

                    let badgeColor = "bg-indigo-500/10 text-indigo-400 border-indigo-500/20";
                    if(goal.category === 'Health & Body') badgeColor = "bg-emerald-500/10 text-emerald-400 border-emerald-500/20";
                    if(goal.category === 'Career & Web') badgeColor = "bg-blue-500/10 text-blue-400 border-blue-500/20";
                    if(goal.category === 'Assets & Lifestyle') badgeColor = "bg-amber-500/10 text-amber-400 border-amber-500/20";

                    card.innerHTML = `
                        <div class="flex items-start space-x-3 mt-0.5">
                            <input type="checkbox" ${goal.completed ? 'checked' : ''} onclick="app.toggleGoal('${goal.id}')" class="mt-1 w-4 h-4 rounded border-slate-700 bg-slate-950 text-brand-600 focus:ring-0 cursor-pointer">
                            <div class="space-y-1">
                                <div class="flex items-center space-x-2">
                                    <span class="text-[10px] px-2 py-0.5 rounded-full border font-medium ${badgeColor}">${goal.category}</span>
                                    <span class="text-xs text-slate-400"><i class="fa-regular fa-calendar mr-1"></i>Target: ${goal.target}</span>
                                </div>
                                <p class="text-sm font-medium text-slate-100 ${goal.completed ? 'line-through text-slate-400' : ''}">${goal.text}</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-1 shrink-0">
                            <button onclick="app.openModal('${goal.id}')" class="p-2 text-slate-400 hover:text-indigo-400 rounded-lg hover:bg-slate-800 transition" title="Edit Goal"><i class="fa-solid fa-pen-to-square text-xs"></i></button>
                            <button onclick="app.deleteGoal('${goal.id}')" class="p-2 text-slate-400 hover:text-red-400 rounded-lg hover:bg-slate-800 transition" title="Delete Goal"><i class="fa-solid fa-trash text-xs"></i></button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }

            // CRUD Operations & Modal Controllers
            openModal(id = null) {
                const modal = document.getElementById('goal-modal');
                modal.classList.remove('hidden');
                modal.classList.add('flex');

                if (id) {
                    document.getElementById('modal-heading').innerText = "Edit Goal Record";
                    const goal = this.state.goals.find(g => g.id === id);
                    document.getElementById('edit-id').value = goal.id;
                    document.getElementById('form-text').value = goal.text;
                    document.getElementById('form-target').value = goal.target;
                    document.getElementById('form-category').value = goal.category;
                } else {
                    document.getElementById('modal-heading').innerText = "Create New Goal";
                    document.getElementById('goal-form').reset();
                    document.getElementById('edit-id').value = '';
                }
            }

            closeModal() {
                const modal = document.getElementById('goal-modal');
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }

            handleFormSubmit(e) {
                e.preventDefault();
                const id = document.getElementById('edit-id').value;
                const text = document.getElementById('form-text').value;
                const target = document.getElementById('form-target').value;
                const category = document.getElementById('form-category').value;

                if (id) {
                    const goal = this.state.goals.find(g => g.id === id);
                    goal.text = text;
                    goal.target = target;
                    goal.category = category;
                } else {
                    const newGoal = {
                        id: Date.now().toString(),
                        text,
                        target,
                        category,
                        completed: false
                    };
                    this.state.goals.unshift(newGoal);
                }

                this.persist();
                this.closeModal();
                this.render();
            }

            toggleGoal(id) {
                const goal = this.state.goals.find(g => g.id === id);
                if(goal) {
                    goal.completed = !goal.completed;
                    this.persist();
                    this.render();
                }
            }

            deleteGoal(id) {
                if(confirm("Are you sure you want to delete this goal milestone from your record database?")) {
                    this.state.goals = this.state.goals.filter(g => g.id !== id);
                    this.persist();
                    this.render();
                }
            }

            syncDatabase() {
                const indicator = document.getElementById('sync-text');
                indicator.innerText = "Syncing with REST API...";
                setTimeout(() => {
                    indicator.innerText = "API Synced";
                }, 800);
            }

            // AI Integration Simulation feature
            triggerAIPlanner() {
                const aiModal = document.getElementById('ai-modal');
                const contentArea = document.getElementById('ai-content-area');
                
                aiModal.classList.remove('hidden');
                aiModal.classList.add('flex');
                
                contentArea.innerHTML = `<p class="text-purple-300 animate-pulse"><i class="fa-solid fa-microchip mr-2"></i>Analyzing roadmap milestones with LLM vector intelligence...</p>`;
                
                setTimeout(() => {
                    contentArea.innerHTML = `
                        <p class="font-semibold text-slate-100 mb-2">💡 Intelligent Focus Strategy Recommended:</p>
                        <ul class="list-disc pl-5 space-y-1 text-xs text-slate-300">
                            <li><strong>Web Development & Remote U.S. Jobs:</strong> Focus daily on modern JavaScript ES6+, React hooks, and Next.js data structures. Build portfolio projects targeting New York tech stacks.</li>
                            <li><strong>Queens Home Acquisition (June 2030):</strong> Establish regular savings allocations mapped against remote USD contractor salary targets.</li>
                            <li><strong>Language Mastery:</strong> Balance English conversational fluency alongside technical documentation analysis.</li>
                        </ul>
                    `;
                }, 1000);
            }

            closeAIModal() {
                const aiModal = document.getElementById('ai-modal');
                aiModal.classList.add('hidden');
                aiModal.classList.remove('flex');
            }
        }

        // Initialize Global Application Controller Singleton
        const app = new GoalsAppEngine();
    </script>
</body>
</html>
